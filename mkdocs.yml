site_name: SpikeAgent
site_description: AI-powered assistant for spike sorting and neural data analysis
site_url: https://spikeagent.github.io/SpikeAgent/
repo_url: https://github.com/SpikeAgent/SpikeAgent
repo_name: SpikeAgent/SpikeAgent
edit_uri: edit/main/docs/

theme:
  name: material
  logo: spikeagent_logo.png
  favicon: spikeagent_logo.png
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: teal
      accent: deep orange

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: index.md
  - User Guide: user-guide.md
  - API Reference: api-reference.md
  - VLM Guide: vlm-guide.md
