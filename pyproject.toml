[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spikeagent"
version = "0.102.3"
description = "AI-powered assistant for spike sorting and neural data analysis"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "SpikeAgent Contributors"}
]
keywords = ["neuroscience", "spike-sorting", "ai", "electrophysiology", "neural-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    # Core scientific stack
    "numpy",
    "scipy",
    "matplotlib",
    "pillow",

    # Neuroscience
    "spikeinterface[full]",
    "probeinterface",

    # LLM / Agent framework
    "langchain",
    "langchain-core",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-google-genai",
    "langgraph",
    "openai",
    "google-api-core",
    "google-ai-generativelanguage",
    "proto-plus",

    # Data & config
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "PyYAML",
    "h5py",
    "pandas",
    "filetype",
    "tqdm",

    # Async / HTTP
    "httpx",
    "requests",
    "nest-asyncio",
]

[project.optional-dependencies]
app = [
    # Streamlit web UI
    "streamlit",
    "streamlit-audiorec",
    "audio-recorder-streamlit",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/SpikeAgent/SpikeAgent"
Documentation = "https://github.com/SpikeAgent/SpikeAgent/tree/main/docs"
Repository = "https://github.com/SpikeAgent/SpikeAgent"
Issues = "https://github.com/SpikeAgent/SpikeAgent/issues"

[project.scripts]
spikeagent = "spikeagent.app.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spikeagent.app" = [
    "autorun_parameters/*.yaml",
    "prompt.txt",
    "style.css",
    "spikeinterface_api_docs/*.txt",
]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
